openapi: 3.1.0

info:
  title: Discovery Server API
  version: 1.0.0
  description: >-
    Merged Decentraland places + events discovery service. A single server that
    replaces the legacy `places` and `events` backends and adds the unified
    `/v1/*` discovery layer (destinations = places + worlds in one shape).


    Successful JSON responses use the envelope `{ ok: true, data: <T>, total?: number }`;
    errors use `{ ok: false, error: string, message?: string }`. A handful of routes
    return non-JSON payloads (link-preview HTML, sitemap XML, health text).

servers:
  - url: https://places.decentraland.org
    description: Places hostname (production). Routes to the merged discovery server.
  - url: https://events.decentraland.org
    description: >-
      Events hostname (production). Both `places.decentraland.org` and
      `events.decentraland.org` resolve to the same merged discovery server, so
      every path below is reachable under either hostname.

tags:
  - name: status
    description: Health and version.
  - name: categories
    description: Place/world and event category listings.
  - name: places
    description: Genesis-city places (parcels/estates).
  - name: worlds
    description: Decentraland Worlds.
  - name: events
    description: Events (one-off and recurrent), search, creation and moderation.
  - name: attendees
    description: Per-event attendance.
  - name: schedules
    description: Curated event schedules (collections).
  - name: profiles
    description: Per-wallet profile settings and authorization permissions.
  - name: destinations
    description: Unified places + worlds discovery entities.
  - name: map
    description: Map feeds (genesis city + unified places/worlds).
  - name: moderation
    description: Admin/data-team place & world moderation (rating, highlight, disable, ranking).
  - name: reports
    description: Content-moderation report upload URLs.
  - name: posters
    description: Event poster uploads.
  - name: social
    description: Open Graph link-preview HTML for place/world share pages.
  - name: sitemap
    description: Event and schedule sitemaps (XML).
  - name: v1
    description: >-
      The unified `/v1/*` discovery surface (destinations, events, categories).
      Successor to the deprecated legacy `/api/*` discovery routes.

security:
  - {}

paths:
  /ping:
    get:
      tags: [status]
      summary: Liveness probe
      description: Returns the plain-text string `pong`.
      security:
        - {}
      responses:
        '200':
          description: Service is alive.
          content:
            text/plain:
              schema:
                type: string
                example: pong

  /api/status:
    get:
      tags: [status]
      summary: Service status (commit hash, version, time)
      security:
        - {}
      responses:
        '200':
          description: Current build/version info.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /api/categories:
    get:
      tags: [categories]
      summary: List place/world categories (legacy)
      deprecated: true
      description: >-
        Active place/world categories with entity counts and English labels.
        Deprecated: use `GET /v1/categories?target=destinations` instead.
      security:
        - {}
      parameters:
        - name: target
          in: query
          description: Legacy scope selector.
          schema:
            type: string
            enum: [places, worlds]
        - name: only_places
          in: query
          schema:
            type: boolean
        - name: only_worlds
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Category list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryListResponse'

  /api/events/categories:
    get:
      tags: [categories]
      summary: List event categories (legacy)
      deprecated: true
      description: >-
        Active event category (tag) names. Deprecated: use
        `GET /v1/categories?target=events` instead.
      security:
        - {}
      responses:
        '200':
          description: Event category names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringListResponse'

  /api/schedules:
    get:
      tags: [schedules]
      summary: List currently-active schedules
      security:
        - {}
      responses:
        '200':
          description: Active schedules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleListResponse'
    post:
      tags: [schedules]
      summary: Create a curated schedule
      description: >-
        Requires a signed-fetch request from a wallet holding the
        `edit_any_schedule` permission (or an admin wallet).
      security:
        - signedFetch: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleInput'
      responses:
        '201':
          description: Created schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/schedules/{schedule_id}:
    parameters:
      - $ref: '#/components/parameters/ScheduleId'
    get:
      tags: [schedules]
      summary: Get a schedule by id
      security:
        - {}
      responses:
        '200':
          description: The schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [schedules]
      summary: Update a schedule
      description: >-
        Requires a signed-fetch request from a wallet holding the
        `edit_any_schedule` permission (or an admin wallet).
      security:
        - signedFetch: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScheduleInput'
      responses:
        '200':
          description: Updated schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/events:
    get:
      tags: [events]
      summary: List events (legacy)
      deprecated: true
      description: >-
        Filtered, paginated event list. Deprecated: use `GET /v1/events`.
        Auth is optional-signed; a valid admin `Bearer` unlocks the admin view
        (`allow_pending`, `allow_deleted`, `approved`, `rejected`, `deleted`).
        `only_attendee=true` / `owner=true` require an authenticated wallet.
      security:
        - {}
        - signedFetch: []
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/EventSearch'
        - $ref: '#/components/parameters/EventPositions'
        - $ref: '#/components/parameters/EventPosition'
        - $ref: '#/components/parameters/EventWorldNames'
        - $ref: '#/components/parameters/EventFrom'
        - $ref: '#/components/parameters/EventTo'
        - $ref: '#/components/parameters/EventOnlyAttendee'
        - $ref: '#/components/parameters/EventOwner'
        - $ref: '#/components/parameters/EventHighlighted'
        - $ref: '#/components/parameters/EventWorld'
        - $ref: '#/components/parameters/EventOrder'
        - $ref: '#/components/parameters/EventSchedule'
        - $ref: '#/components/parameters/EventEstateId'
        - $ref: '#/components/parameters/EventList'
        - $ref: '#/components/parameters/EventCommunityId'
        - $ref: '#/components/parameters/EventCreator'
        - $ref: '#/components/parameters/EventWithConnectedUsers'
        - $ref: '#/components/parameters/EventAllowPending'
        - $ref: '#/components/parameters/EventAllowDeleted'
        - $ref: '#/components/parameters/EventApproved'
        - $ref: '#/components/parameters/EventRejected'
        - $ref: '#/components/parameters/EventDeleted'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Matching events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [events]
      summary: Create an event
      description: Requires a signed-fetch request. The authenticated wallet becomes the event owner.
      security:
        - signedFetch: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventPayload'
      responses:
        '200':
          description: Created event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/events/search:
    post:
      tags: [events]
      summary: Search events (legacy)
      description: >-
        Same query-string filters as `GET /api/events`, plus body-driven
        `placeIds` and `communityId`. Auth matches `GET /api/events`.
      security:
        - {}
        - signedFetch: []
        - adminBearer: []
      parameters:
        - $ref: '#/components/parameters/EventSearch'
        - $ref: '#/components/parameters/EventPositions'
        - $ref: '#/components/parameters/EventWorldNames'
        - $ref: '#/components/parameters/EventFrom'
        - $ref: '#/components/parameters/EventTo'
        - $ref: '#/components/parameters/EventOnlyAttendee'
        - $ref: '#/components/parameters/EventOwner'
        - $ref: '#/components/parameters/EventHighlighted'
        - $ref: '#/components/parameters/EventWorld'
        - $ref: '#/components/parameters/EventOrder'
        - $ref: '#/components/parameters/EventSchedule'
        - $ref: '#/components/parameters/EventEstateId'
        - $ref: '#/components/parameters/EventList'
        - $ref: '#/components/parameters/EventWithConnectedUsers'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                placeIds:
                  type: array
                  items:
                    type: string
                communityId:
                  type: string
      responses:
        '200':
          description: Matching events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/events/attending:
    get:
      tags: [events]
      summary: Events the authenticated user attends
      security:
        - signedFetch: []
      responses:
        '200':
          description: Attended events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/events/{event_id}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [events]
      summary: Get a single event
      description: >-
        Optional-signed. The signed wallet's attendance is reflected in
        `attending`; a valid admin `Bearer` grants the admin view.
      security:
        - {}
        - signedFetch: []
        - adminBearer: []
      responses:
        '200':
          description: The event, decorated with the caller's attendance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventWithAttendanceResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [events]
      summary: Update an event
      description: >-
        Owner/editor (or admin wallet / admin `Bearer`). Moderation fields
        (`approved`, `rejected`, `rejection_reason`, `highlighted`) are only
        applied for admins/permitted wallets. Requires an authenticated actor.
      security:
        - signedFetch: []
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventPayload'
      responses:
        '200':
          description: Updated event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [events]
      summary: Soft-delete an event
      description: Owner, admin wallet, or admin `Bearer`. Requires an authenticated actor.
      security:
        - signedFetch: []
        - adminBearer: []
      parameters:
        - name: actor
          in: query
          description: Overrides the recorded actor identity (admin automation).
          schema:
            type: string
      responses:
        '200':
          description: The event was soft-deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteEventResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/events/{event_id}/attendees:
    parameters:
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [attendees]
      summary: List event attendees
      security:
        - {}
      responses:
        '200':
          description: Attendee list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendeeListResponse'
    post:
      tags: [attendees]
      summary: Mark the authenticated user as attending
      security:
        - signedFetch: []
      responses:
        '200':
          description: Updated attendee list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendeeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [attendees]
      summary: Remove the authenticated user's attendance
      security:
        - signedFetch: []
      responses:
        '200':
          description: Updated attendee list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendeeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/places:
    get:
      tags: [places]
      summary: List places
      description: Filtered, paginated place list. Optional-signed (decorates the caller's like/favorite state).
      security:
        - {}
        - signedFetch: []
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Positions'
        - $ref: '#/components/parameters/Categories'
        - $ref: '#/components/parameters/Names'
        - $ref: '#/components/parameters/OnlyHighlighted'
        - $ref: '#/components/parameters/OnlyFavorites'
        - $ref: '#/components/parameters/Owner'
        - name: creator_address
          in: query
          schema:
            type: string
        - name: sdk
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/PlaceOrderBy'
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Matching places.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceListResponse'
    post:
      tags: [places]
      summary: Get places by ids
      description: 'Optional-signed. Body is an array of ids or `{ ids: string[] }`.'
      security:
        - {}
        - signedFetch: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdsBody'
      responses:
        '200':
          description: Places for the given ids.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/places/status:
    post:
      tags: [places]
      summary: Get place status rows by ids
      description: 'Public. Returns minimal status rows (no aggregates). Body is an array of ids or `{ ids: string[] }`.'
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdsBody'
      responses:
        '200':
          description: Status rows for the given ids.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceStatusListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/places/{place_id}:
    parameters:
      - $ref: '#/components/parameters/PlaceId'
    get:
      tags: [places]
      summary: Get a single place
      description: Optional-signed (decorates the caller's like/favorite state).
      security:
        - {}
        - signedFetch: []
      responses:
        '200':
          description: The place with aggregates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/places/{place_id}/categories:
    parameters:
      - $ref: '#/components/parameters/PlaceId'
    get:
      tags: [places]
      summary: Get a place's category slugs
      security:
        - {}
      responses:
        '200':
          description: The place's categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceCategoriesResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/places/{entity_id}/likes:
    parameters:
      - name: entity_id
        in: path
        required: true
        description: Place id.
        schema:
          type: string
    patch:
      tags: [places]
      summary: Like/dislike a place (legacy)
      deprecated: true
      description: >-
        Deprecated: use `PATCH /v1/destinations/{id}/like`. `like: true` = like,
        `false` = dislike, `null` = clear.
      security:
        - signedFetch: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegacyLikeBody'
      responses:
        '200':
          description: Refreshed interaction summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractionSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/places/{entity_id}/favorites:
    parameters:
      - name: entity_id
        in: path
        required: true
        description: Place id.
        schema:
          type: string
    patch:
      tags: [places]
      summary: Favorite/unfavorite a place (legacy)
      deprecated: true
      description: 'Deprecated: use `PATCH /v1/destinations/{id}/favorite`.'
      security:
        - signedFetch: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LegacyFavoritesBody'
      responses:
        '200':
          description: Refreshed interaction summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InteractionSummaryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/places/{place_id}/rating:
    parameters:
      - $ref: '#/components/parameters/PlaceId'
    put:
      tags: [moderation]
      summary: Set a place's content rating
      description: Admin only — a signed admin wallet OR the service admin `Bearer` token.
      security:
        - signedFetch: []
        - adminBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: string
                comment:
                  type: string
      responses:
        '200':
          description: Updated place.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceModerationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/places/{place_id}/highlight:
    parameters:
      - $ref: '#/components/parameters/PlaceId'
    put:
      tags: [moderation]
      summary: Highlight/unhighlight a place
      description: Admin only — a signed admin wallet OR the service admin `Bearer` token. Defaults to highlighted unless `highlighted:false`.
      security:
        - signedFetch: []
        - adminBearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                highlighted:
                  type: boolean
      responses:
        '200':
          description: Updated place.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceModerationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/places/{place_id}/disable:
    parameters:
      - $ref: '#/components/parameters/PlaceId'
    put:
      tags: [moderation]
      summary: Disable/enable a place
      description: Admin only — a signed admin wallet OR the service admin `Bearer` token. Defaults to disabled unless `disabled:false`.
      security:
        - signedFetch: []
        - adminBearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                disabled:
                  type: boolean
      responses:
        '200':
          description: Updated place.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceModerationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/places/{place_id}/ranking:
    parameters:
      - $ref: '#/components/parameters/PlaceId'
    put:
      tags: [moderation]
      summary: Set a place's ranking (data team)
      description: >-
        Data-team only — requires the `DATA_TEAM_AUTH_TOKEN` `Bearer`. This route
        is only mounted when that token is configured.
      security:
        - dataTeamBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ranking]
              properties:
                ranking:
                  type: number
      responses:
        '200':
          description: Updated place.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaceModerationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/map:
    get:
      tags: [map]
      summary: Genesis-city map feed
      description: >-
        Genesis-city places keyed by base position, with realtime `user_count`
        and 30-day `user_visits`. Optional-signed. `limit` is capped at 500.
      security:
        - {}
        - signedFetch: []
      parameters:
        - $ref: '#/components/parameters/Positions'
        - $ref: '#/components/parameters/Categories'
        - $ref: '#/components/parameters/OnlyFavorites'
        - $ref: '#/components/parameters/OnlyHighlighted'
        - $ref: '#/components/parameters/MapLimit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Places keyed by base position.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapResponse'

  /api/map/places:
    get:
      tags: [map]
      summary: Unified map places+worlds feed
      description: >-
        The unified places+worlds list for the map, always decorated with
        realtime connected-user counts. Optional-signed. `limit` is capped at 500.
      security:
        - {}
        - signedFetch: []
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Positions'
        - $ref: '#/components/parameters/Names'
        - $ref: '#/components/parameters/WorldNames'
        - $ref: '#/components/parameters/Categories'
        - $ref: '#/components/parameters/OnlyHighlighted'
        - $ref: '#/components/parameters/MapLimit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Destinations for the map.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DestinationListResponse'

  /api/report:
    post:
      tags: [reports]
      summary: Create a content-moderation report upload URL
      description: Requires a signed-fetch request. Returns a presigned S3 PUT URL for the report payload.
      security:
        - signedFetch: []
      responses:
        '200':
          description: Presigned upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UrlResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/poster:
    post:
      tags: [posters]
      summary: Upload a horizontal event poster
      description: Requires a signed-fetch request. `multipart/form-data` with a `poster` file field.
      security:
        - signedFetch: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
