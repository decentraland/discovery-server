          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    signedFetch:
      type: apiKey
      in: header
      name: x-identity-auth-chain-0
      description: >-
        Decentraland ADR-44 signed-fetch. The request carries an AuthChain across
        several custom headers — `x-identity-auth-chain-0`, `x-identity-auth-chain-1`,
        `x-identity-auth-chain-2`, `x-identity-timestamp`, `x-identity-metadata` —
        which the server verifies to recover the caller's wallet address. Requests
        signed by scenes (`signer: decentraland-kernel-scene`) are rejected. On
        optional-signed routes the headers may be omitted (the request is treated
        as anonymous); on required routes their absence or an invalid signature
        yields 401. Only the first header is modelled here; all are required together.
    adminBearer:
      type: http
      scheme: bearer
      description: >-
        Service admin bearer token (`API_ADMIN_TOKEN`, plus the legacy
        `LEGACY_PLACES_ADMIN_AUTH_TOKEN` / `LEGACY_EVENTS_ADMIN_AUTH_TOKEN`
        rotation aliases). Used on moderation routes (as an alternative to a signed
        admin wallet) and to unlock the admin event view/moderation.
    dataTeamBearer:
      type: http
      scheme: bearer
      description: >-
        Data-team bearer token (`DATA_TEAM_AUTH_TOKEN`) for the place/world ranking
        routes. Those routes are only mounted when the token is configured.

  parameters:
    Limit:
      name: limit
      in: query
      description: Page size (non-negative integer).
      schema:
        type: integer
        minimum: 0
    Offset:
      name: offset
      in: query
      description: Number of items to skip (non-negative integer).
      schema:
        type: integer
        minimum: 0
    MapLimit:
      name: limit
      in: query
      description: Page size (non-negative integer, capped at 500).
      schema:
        type: integer
        minimum: 0
        maximum: 500
    Order:
      name: order
      in: query
      description: Sort direction.
      schema:
        type: string
        enum: [asc, desc]
    Search:
      name: search
      in: query
      schema:
        type: string
    Positions:
      name: positions
      in: query
      description: Repeatable and/or comma-separated base positions `"x,y"`.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    Categories:
      name: categories
      in: query
      description: Repeatable and/or comma-separated category slugs.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    Names:
      name: names
      in: query
      description: Repeatable and/or comma-separated names (worlds).
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    WorldNames:
      name: world_names
      in: query
      description: Repeatable and/or comma-separated world names.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    OnlyHighlighted:
      name: only_highlighted
      in: query
      schema:
        type: boolean
    OnlyFavorites:
      name: only_favorites
      in: query
      description: Only entities the caller has favorited (requires auth to be meaningful).
      schema:
        type: boolean
    Owner:
      name: owner
      in: query
      description: Filter by owner wallet address.
      schema:
        type: string
    Kinds:
      name: kinds
      in: query
      description: Restrict destinations to specific kinds.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum: [place, world]
    With:
      name: with
      in: query
      description: Repeatable and/or comma-separated decoration flags.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum: [live_events, connected_users, next_event]
    WithLiveEvents:
      name: with_live_events
      in: query
      description: Decorate with a live-event flag (alias for `with=live_events`).
      schema:
        type: boolean
    WithConnectedUsers:
      name: with_connected_users
      in: query
      description: Decorate with realtime connected-user counts (alias for `with=connected_users`).
      schema:
        type: boolean
    PlaceOrderBy:
      name: order_by
      in: query
      schema:
        type: string
        enum: [like_score, updated_at, created_at, most_active]
    WorldOrderBy:
      name: order_by
      in: query
      description: Defaults to `most_active`.
      schema:
        type: string
        enum: [like_score, updated_at, created_at, most_active]
        default: most_active
    DestinationOrderBy:
      name: order_by
      in: query
      schema:
        type: string
        enum: [like_score, updated_at, created_at]
    PlaceId:
      name: place_id
      in: path
      required: true
      description: Place id.
      schema:
        type: string
    WorldId:
      name: world_id
      in: path
      required: true
      description: World id.
      schema:
        type: string
    EventId:
      name: event_id
      in: path
      required: true
      description: Event id.
      schema:
        type: string
    ScheduleId:
      name: schedule_id
      in: path
      required: true
      description: Schedule id.
      schema:
        type: string
    DestinationId:
      name: id
      in: path
      required: true
      description: Destination id (a place id or a world id).
      schema:
        type: string
    EventSearch:
      name: search
      in: query
      schema:
        type: string
    EventPositions:
      name: positions
      in: query
      description: Repeatable `"x,y"` base positions (not comma-split).
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    EventPosition:
      name: position
      in: query
      description: A single `"x,y"` base position (takes precedence over `positions`).
      schema:
        type: string
    EventWorldNames:
      name: world_names
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    EventFrom:
      name: from
      in: query
      description: Lower bound on `next_start_at` (ISO date-time).
      schema:
        type: string
    EventTo:
      name: to
      in: query
      description: Upper bound on `next_start_at` (ISO date-time).
      schema:
        type: string
    EventOnlyAttendee:
      name: only_attendee
      in: query
      description: Only events the authenticated caller attends (requires auth).
      schema:
        type: boolean
    EventOwner:
      name: owner
      in: query
      description: Only the authenticated caller's own events, across every status (requires auth).
      schema:
        type: boolean
    EventHighlighted:
      name: highlighted
      in: query
      schema:
        type: boolean
    EventWorld:
      name: world
      in: query
      description: true = worlds only, false = non-worlds only, omitted = both.
      schema:
        type: boolean
    EventOrder:
      name: order
      in: query
      description: Sort direction on `next_start_at` (default asc).
      schema:
        type: string
        enum: [asc, desc]
    EventSchedule:
      name: schedule
      in: query
      description: Only events referencing this schedule (collection) id.
      schema:
        type: string
    EventEstateId:
      name: estate_id
      in: query
      schema:
        type: string
    EventList:
      name: list
      in: query
      description: >-
        Time window. `live` = happening now; `upcoming` = future; `active` (default)
        = not yet finished; `all` = no time filter. The deprecated value `highlight`
        maps to `active` + `highlighted=true`.
      schema:
        type: string
        enum: [live, upcoming, active, all, highlight]
        default: active
    EventCommunityId:
      name: community_id
      in: query
      schema:
        type: string
    EventCreator:
      name: creator
      in: query
      schema:
        type: string
    EventWithConnectedUsers:
      name: with_connected_users
      in: query
      description: Decorate each event with the realtime connected addresses at its scene/world.
      schema:
        type: boolean
    EventAllowPending:
      name: allow_pending
      in: query
      description: Admin only — include pending/rejected (unapproved) events.
      schema:
        type: boolean
    EventAllowDeleted:
      name: allow_deleted
      in: query
      description: Admin only — include soft-deleted events.
      schema:
        type: boolean
    EventApproved:
      name: approved
      in: query
      description: Admin only — tri-state precise moderation selector.
      schema:
        type: boolean
    EventRejected:
      name: rejected
      in: query
      description: Admin only — tri-state precise moderation selector.
      schema:
        type: boolean
    EventDeleted:
      name: deleted
      in: query
      description: Admin only — tri-state precise moderation selector.
      schema:
        type: boolean

  responses:
    BadRequest:
      description: Malformed or semantically invalid request input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Missing or invalid authentication (signature or token).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Authenticated but not permitted to perform the action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: The referenced entity does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApiSuccess:
      type: object
      description: Base success envelope. `data` is added by each concrete response schema.
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true
        total:
          type: integer
          description: Total matching count (list endpoints only).

    ApiError:
      type: object
      description: Error envelope.
      required: [ok, error]
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
          description: Short error name/kind (e.g. the ServiceError subclass name).
        message:
          type: string
          description: Human-readable detail (omitted on 500).

    Place:
      type: object
      properties:
        id: { type: string }
        title: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        image: { type: [string, 'null'] }
        owner: { type: [string, 'null'] }
        creator_address: { type: [string, 'null'] }
        positions:
          type: array
          items: { type: string }
        base_position: { type: string }
        contact_name: { type: [string, 'null'] }
        contact_email: { type: [string, 'null'] }
        content_rating: { type: string }
        likes: { type: integer }
        dislikes: { type: integer }
        favorites: { type: integer }
        like_rate: { type: [number, 'null'] }
        like_score: { type: [number, 'null'] }
        ranking: { type: [number, 'null'] }
        highlighted: { type: boolean }
        highlighted_image: { type: [string, 'null'] }
        disabled: { type: boolean }
        disabled_at: { type: [string, 'null'] }
        disabled_reason: { type: [string, 'null'] }
        world: { type: boolean }
        world_name: { type: [string, 'null'] }
        world_id: { type: [string, 'null'] }
        deployed_at: { type: string }
        categories:
          type: array
          items: { type: string }
        sdk: { type: [string, 'null'] }
        created_at: { type: string }
        updated_at: { type: string }

    AggregatePlace:
      allOf:
        - $ref: '#/components/schemas/Place'
        - type: object
          description: A place decorated with the requesting user's like/favorite state.
          properties:
            user_like: { type: boolean }
            user_dislike: { type: boolean }
            user_favorite: { type: boolean }
            user_count:
              type: integer
              description: Realtime connected users (from hot-scenes), when available.
            user_visits:
              type: integer
              description: 30-day unique visitors (from scene-stats), when available.

    PlaceStatus:
      type: object
      description: Minimal status row returned by the by-ids status endpoint.
      properties:
        id: { type: string }
        disabled: { type: boolean }
        world: { type: boolean }
        world_name: { type: [string, 'null'] }
        base_position: { type: string }

    World:
      type: object
      properties:
        id: { type: string }
        world_name: { type: string }
        title: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        image: { type: [string, 'null'] }
        content_rating: { type: string }
        categories:
          type: array
          items: { type: string }
        owner: { type: [string, 'null'] }
        show_in_places: { type: boolean }
        single_player: { type: boolean }
        skybox_time: { type: [number, 'null'] }
        is_private: { type: boolean }
        likes: { type: integer }
        dislikes: { type: integer }
        favorites: { type: integer }
        like_rate: { type: [number, 'null'] }
        like_score: { type: [number, 'null'] }
        highlighted: { type: boolean }
        highlighted_image: { type: [string, 'null'] }
        ranking: { type: [number, 'null'] }
        created_at: { type: string }
        updated_at: { type: string }
        contact_name: { type: [string, 'null'] }
        contact_email: { type: [string, 'null'] }
        creator_address: { type: [string, 'null'] }
        sdk: { type: [string, 'null'] }
        deployed_at: { type: [string, 'null'] }

    AggregateWorld:
      allOf:
        - $ref: '#/components/schemas/World'
        - type: object
          properties:
            user_like: { type: boolean }
            user_dislike: { type: boolean }
            user_favorite: { type: boolean }
            user_count:
              type: integer
              description: Realtime connected users (from worlds-live-data), when available.

    Destination:
      type: object
      description: A unified discovery entity — a place or a world in one shape.
      properties:
        id: { type: string }
        kind:
          type: string
          enum: [place, world]
        title: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        image: { type: [string, 'null'] }
        base_position: { type: [string, 'null'] }
        world_name: { type: [string, 'null'] }
        categories:
          type: array
          items: { type: string }
        likes: { type: integer }
        dislikes: { type: integer }
        favorites: { type: integer }
        like_rate: { type: [number, 'null'] }
        like_score: { type: [number, 'null'] }
        highlighted: { type: boolean }
        user_like: { type: boolean }
        user_dislike: { type: boolean }
        user_favorite: { type: boolean }
        live_event:
          type: boolean
          description: Decorated when `with=live_events`.
        user_count:
          type: integer
          description: Realtime connected users, decorated when `with=connected_users`.
        user_visits:
          type: integer
          description: 30-day unique visitors (places only; 0 for worlds).
        next_event:
          description: The next upcoming event at this destination (decorated when `with=next_event`).
          type: [object, 'null']
          properties:
            id: { type: string }
            name: { type: string }
            next_start_at: { type: string }

    Event:
      type: object
      description: >-
        An event. Date fields (`start_at`, `finish_at`, `next_start_at`,
        `next_finish_at`, `recurrent_until`, `recurrent_dates`, `deleted_at`,
        `created_at`, `updated_at`) are serialized as ISO date-time strings.
      properties:
        id: { type: string }
        name: { type: string }
        image: { type: [string, 'null'] }
        image_vertical: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        start_at: { type: string, format: date-time }
        finish_at: { type: string, format: date-time }
        duration: { type: integer }
        all_day: { type: boolean }
        next_start_at: { type: [string, 'null'], format: date-time }
        next_finish_at: { type: [string, 'null'], format: date-time }
        recurrent: { type: boolean }
        recurrent_frequency: { type: [string, 'null'] }
        recurrent_setpos: { type: [integer, 'null'] }
        recurrent_monthday: { type: [integer, 'null'] }
        recurrent_weekday_mask: { type: integer }
        recurrent_month_mask: { type: integer }
        recurrent_interval: { type: integer }
        recurrent_count: { type: [integer, 'null'] }
        recurrent_until: { type: [string, 'null'], format: date-time }
        recurrent_dates:
          type: array
          items: { type: string, format: date-time }
        x: { type: integer }
        y: { type: integer }
        server: { type: [string, 'null'] }
        world: { type: boolean }
        estate_id: { type: [string, 'null'] }
        estate_name: { type: [string, 'null'] }
        scene_name: { type: [string, 'null'] }
        place_id: { type: [string, 'null'] }
        world_id: { type: [string, 'null'] }
        community_id: { type: [string, 'null'] }
        url: { type: [string, 'null'] }
        user: { type: string }
        user_name: { type: [string, 'null'] }
        contact: { type: [string, 'null'] }
        details: { type: [string, 'null'] }
        approved: { type: boolean }
        rejected: { type: boolean }
        approved_by: { type: [string, 'null'] }
        rejected_by: { type: [string, 'null'] }
        rejection_reason: { type: [string, 'null'] }
        highlighted: { type: boolean }
        total_attendees: { type: integer }
        latest_attendees:
          type: array
          items: { type: string }
        categories:
          type: array
          items: { type: string }
        schedules:
          type: array
          items: { type: string }
        deleted_by_user: { type: boolean }
        deleted_by_admin: { type: boolean }
        deleted_by: { type: [string, 'null'] }
        deleted_at: { type: [string, 'null'], format: date-time }
        deleted_reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        connected_addresses:
          type: array
          description: Present only when the list was requested `with_connected_users=true`.
          items: { type: string }

    EventWithAttendance:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            attending:
              type: boolean
              description: Whether the requesting wallet attends this event.

    V1Event:
      allOf:
        - $ref: '#/components/schemas/EventWithAttendance'
        - type: object
          properties:
            destination_id:
              type: [string, 'null']
              description: The event's world_id or place_id.
            destination:
              description: A decorated destination summary, or null.
              oneOf:
                - $ref: '#/components/schemas/Destination'
                - type: 'null'

    EventAttendee:
      type: object
      properties:
        event_id: { type: string }
        user: { type: string }
        user_name: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }

    Schedule:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        image: { type: [string, 'null'] }
        theme: { type: [string, 'null'] }
        background:
          type: array
          items: { type: string }
        active: { type: boolean }
        active_since: { type: string }
        active_until: { type: string }
        created_at: { type: string }
        updated_at: { type: string }

    ProfilePermission:
      type: string
      description: Authorization grants stored per wallet.
      enum:
        - approve_own_event
        - approve_any_event
        - edit_any_event
        - edit_any_schedule
        - edit_any_profile
        - test_any_notification

    ProfileSettings:
      type: object
      properties:
        user: { type: string }
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/ProfilePermission'

    Category:
      type: object
      description: A place/world category with its entity count and English label.
      properties:
        name: { type: string }
        count: { type: integer }
        i18n:
          type: object
          properties:
            en: { type: string }

    InteractionSummary:
      type: object
      description: Refreshed like/favorite counts and the caller's own state after a mutation.
      properties:
        likes: { type: integer }
        dislikes: { type: integer }
        favorites: { type: integer }
        user_like: { type: boolean }
        user_dislike: { type: boolean }
        user_favorite: { type: boolean }

    MapPlace:
      type: object
      description: Thin per-place projection for the genesis-city map feed.
      properties:
        id: { type: string }
        base_position: { type: string }
        title: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        image: { type: [string, 'null'] }
        contact_name: { type: [string, 'null'] }
        categories:
          type: array
          items: { type: string }
        user_favorite: { type: boolean }
        user_like: { type: boolean }
        user_dislike: { type: boolean }
        user_count: { type: integer }
        user_visits: { type: integer }

    Status:
      type: object
      properties:
        commitHash: { type: string }
        version: { type: string }
        time: { type: integer }

    CreateEventPayload:
      type: object
      required: [name, start_at]
      properties:
        name: { type: string }
        description: { type: [string, 'null'] }
        image: { type: [string, 'null'] }
        image_vertical: { type: [string, 'null'] }
        contact: { type: [string, 'null'] }
        details: { type: [string, 'null'] }
        url: { type: [string, 'null'] }
        start_at: { type: string, format: date-time }
        finish_at: { type: string, format: date-time }
        duration: { type: integer }
        all_day: { type: boolean }
        x: { type: integer }
        y: { type: integer }
        server: { type: [string, 'null'] }
        world: { type: boolean }
        estate_id: { type: [string, 'null'] }
        estate_name: { type: [string, 'null'] }
        scene_name: { type: [string, 'null'] }
        community_id: { type: [string, 'null'] }
        categories:
          type: array
          items: { type: string }
        schedules:
          type: array
          items: { type: string }
        user_name: { type: [string, 'null'] }
        recurrent: { type: boolean }
        recurrent_frequency: { type: [string, 'null'] }
        recurrent_interval: { type: integer }
        recurrent_count: { type: [integer, 'null'] }
        recurrent_until: { type: [string, 'null'], format: date-time }
        recurrent_weekday_mask: { type: integer }
        recurrent_month_mask: { type: integer }
        recurrent_setpos: { type: [integer, 'null'] }
        recurrent_monthday: { type: [integer, 'null'] }

    UpdateEventPayload:
      allOf:
        - $ref: '#/components/schemas/CreateEventPayload'
        - type: object
          description: >-
            All create fields are optional on update. Moderation fields are only
            applied for admins / permitted wallets. `actor` overrides the recorded
            moderator identity (admin automation).
          properties:
            approved: { type: boolean }
            rejected: { type: boolean }
            rejection_reason: { type: [string, 'null'] }
            highlighted: { type: boolean }
            actor: { type: string }

    CreateScheduleInput:
      type: object
      required: [name, active_since, active_until]
      properties:
        name: { type: string }
        description: { type: [string, 'null'] }
        image: { type: [string, 'null'] }
        theme: { type: [string, 'null'] }
        background:
          type: array
          items: { type: string }
        active: { type: boolean }
        active_since: { type: string }
        active_until: { type: string }

    UpdateScheduleInput:
      type: object
      description: Partial patch — any subset of the schedule's editable fields.
      properties:
        name: { type: string }
        description: { type: [string, 'null'] }
        image: { type: [string, 'null'] }
        theme: { type: [string, 'null'] }
        background:
          type: array
          items: { type: string }
        active: { type: boolean }
        active_since: { type: string }
        active_until: { type: string }

    IdsBody:
      description: An array of ids, or an object wrapping them under `ids`.
      oneOf:
        - type: array
          items: { type: string }
        - type: object
          required: [ids]
          properties:
            ids:
              type: array
              items: { type: string }

    DestinationBatchBody:
      type: object
      description: At least one selector; all are optional. Ignored if the body is absent/invalid.
      properties:
        ids:
          type: array
          items: { type: string }
        positions:
          type: array
          items: { type: string }
        world_names:
          type: array
          items: { type: string }

    LegacyLikeBody:
      type: object
      required: [like]
      properties:
        like:
          type: [boolean, 'null']
          description: true = like, false = dislike, null = clear.

    LegacyFavoritesBody:
      type: object
      required: [favorites]
      properties:
        favorites:
          type: boolean

    # ---- Response envelopes ----

    StatusResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Status'

    StringListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items: { type: string }

    CategoryListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Category'

    V1CategoriesResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          required: [data]
          properties:
            data:
              oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/Category'
                - type: array
                  items: { type: string }

    ScheduleResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Schedule'

    ScheduleListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Schedule'

    EventResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/Event'

    EventWithAttendanceResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          required: [data]
          properties:
            data:
              $ref: '#/components/schemas/EventWithAttendance'

    EventListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/Event'

    V1EventResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
        - type: object
          required: [data]
