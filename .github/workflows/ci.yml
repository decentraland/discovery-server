name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Use Node.js 24.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn
      - name: install
        run: yarn install --frozen-lockfile
      - name: lint
        run: yarn lint:check
      - name: build
        run: yarn build
      - name: unit tests
        run: yarn test:unit
      - name: start integration dependencies
        run: docker compose -f docker-compose.test.yml up -d --wait
      - name: create S3 buckets in localstack
        run: |
          docker compose -f docker-compose.test.yml exec -T localstack awslocal s3 mb s3://moderation-reports || true
          docker compose -f docker-compose.test.yml exec -T localstack awslocal s3 mb s3://event-posters || true
      - name: integration tests
        run: yarn test:integration
        env:
          PG_COMPONENT_PSQL_CONNECTION_STRING: postgres://postgres:postgres@localhost:5432/discovery
          AWS_ENDPOINT: http://localhost:4566
          AWS_REGION: us-east-1
          CONTENT_MODERATION_BUCKET_NAME: moderation-reports
          POSTER_BUCKET_NAME: event-posters
          # Fast-failing URL keeps VP lookups hermetic (getVotingPower degrades to 0).
          SNAPSHOT_SCORE_URL: http://localhost:1/
