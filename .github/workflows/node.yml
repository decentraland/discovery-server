name: node

on:
  push:

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: '.nvmrc'
          cache: yarn
      - name: install
        run: yarn
      - name: lint
        run: yarn lint
      - name: format check
        run: yarn format:check
      - name: build
        run: yarn build
      - name: test
        run: yarn test
